name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No dependencies to install: src/ and tests/ are standard library only,
      # and the attested-form fixture is committed, so nothing is downloaded.
      # The two scripts in scripts/ need a UD Irish-IDT checkout at
      # data/UD_Irish-IDT, which is not in the repo, so they are not run here.
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
